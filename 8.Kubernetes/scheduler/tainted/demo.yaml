apiVersion: apps/v1
kind: Deployment
metadata:
  name: taited-dpl
spec:
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: taited-cont
        image: nginx:alpine
        ports:
        - containerPort: 80
