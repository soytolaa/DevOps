apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dpl
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
      - name: postgres-cont
        image: postgres:latest
        ports:
        - containerPort: 5432
        envFrom:
          - configMapRef:
              name: postgres-cofigmap
