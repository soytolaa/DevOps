apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dpl
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      imagePullSecrets: 
        - name: ghcr-secret
      containers:
      - name: nginx-app
        image:  ghcr.io/zoeistad/nginx-demo:v1.0.0
        ports:
        - containerPort: 80