apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: spring-cont
        image: megamind007/file-upload:v.1.1.1
        ports:
        - name: http
          containerPort: 8080
