server {
    server_name jenkins.soytola.site;

    location / {
        proxy_pass http://localhost:8080;

        # Preserve original host and client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Jenkins (fix reverse proxy issues)
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering (important for console logs / streaming)
        proxy_buffering off;

        # Increase timeout for long builds
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        # WebSocket support (VERY IMPORTANT)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Prevent caching issues
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jenkins.soytola.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jenkins.soytola.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = jenkins.soytola.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name jenkins.soytola.site;
    return 404; # managed by Certbot


}