---
- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Create NFS mount directory
  ansible.builtin.file:
    path: "{{ nfs_client.mount_path }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: "0777"

- name: Mount NFS share
  ansible.posix.mount:
    src: "{{ hostvars[groups['nfs-servers'][0]].nfs_internal_ip }}:{{ nfs_server.export_path }}"
    path: "{{ nfs_client.mount_path }}"
    fstype: nfs
    opts: "{{ nfs.mount_options }}"
    state: mounted