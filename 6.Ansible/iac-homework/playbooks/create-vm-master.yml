---
- name: Create GCP Master Instances
  hosts: localhost
  become: true
  vars_files:
    - ../vars/machine.yml

  tasks:
    - name: Slurp the local public key
      slurp:
        src: "{{ ssh_public_key }}"
      register: ssh_pub_key

    - name: Install Python packages via apt
      apt:
        name:
          - python3-requests
          - python3-google-auth
        state: present
        update_cache: yes

    - name: Create static NAT IP for masters
      google.cloud.gcp_compute_address:
        name: "{{ item.static_ip }}"
        region: "{{ item.zone | regex_replace('-[a-z]$', '') }}"
        project: "{{ google_project_id }}"
        address_type: EXTERNAL
        auth_kind: application
        state: present
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
        GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
      loop: "{{ machine_info.masters }}"
      loop_control:
        label: "{{ item.name }}"
      register: gcp_static_ips

    - name: Create GCP Master instances
      google.cloud.gcp_compute_instance:
        name: "{{ item.name }}"
        machine_type: "{{ item.machine_type }}"
        zone: "{{ item.zone }}"
        project: "{{ google_project_id }}"
        auth_kind: application
        state: present
        metadata:
          ssh-keys: "ts:{{ ssh_pub_key['content'] | b64decode }}"
          startup-script: |
            #!/bin/bash
            sudo apt-get update && sudo apt-get upgrade -y
            sudo apt-get install fish -y
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              disk_size_gb: "{{ item.disk_size }}"
              disk_type: "{{ item.disk_type }}"
              source_image: "{{ item.image }}"
        network_interfaces:
          - network:
              selfLink: "projects/{{ google_project_id }}/global/networks/default"
            access_configs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
                nat_ip: "{{ (gcp_static_ips.results | selectattr('item.static_ip', 'equalto', item.static_ip) | first) }}"
        tags:
          items:
            - http-server
            - https-server
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_path }}"
        GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
      loop: "{{ machine_info.masters }}"
      loop_control:
        label: "{{ item.name }}"
      register: gcp_instance_master

    - name: Write gcp_instance_master into json file (debug)
      copy:
        content: "{{ gcp_instance_master | to_nice_json }}"
        dest: "./gcp_instance_master.json"

    - name: Check if inventory.ini exists
      stat:
        path: "../inventory.ini"
      register: inventory_stat

    - name: Slurp existing inventory.ini
      slurp:
        src: "../inventory.ini"
      register: inventory_raw
      when: inventory_stat.stat.exists

    - name: Decode inventory content
      set_fact:
        inventory_content: "{{ inventory_raw.content | b64decode }}"
      when: inventory_stat.stat.exists

    - name: Create Inventory using jinja
      template:
        src: ../templates/master-template.j2
        dest: ../inventory.ini
        trim_blocks: true
        lstrip_blocks: true