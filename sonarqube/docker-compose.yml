services: 
  postgres: 
    image: postgres:16-alpine
    container_name: sonarqube-postgres 
    restart: always 
    environment: 
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DATABASE: ${DB_NAME}
    volumes: 
      - postgres_sonar_vol:/var/lib/postgresql/data
    networks: 
      - sonarqube_net
  sonarqube: 
    image: sonarqube:community 
    container_name: sonarqube-cont 
    restart: always 
    depends_on:  
      - postgres
    environment: 
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-postgres:5432/${DB_NAME}
      SONAR_JDBC_USERNAME: ${DB_USERNAME}
      SONAR_JDBC_PASSWORD: ${DB_PASS}
    ports: 
      - "9000:9000"
    volumes: 
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: 
      - sonarqube_net

volumes: 
  sonarqube_data: 
  sonarqube_extensions: 
  sonarqube_logs: 
  postgres_sonar_vol: 
networks: 
  sonarqube_net: 
    name: sonarqube_net 
    driver: bridge
